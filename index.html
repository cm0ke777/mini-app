<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>iWavee Music</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="hdr">
  <button id="backBtn" class="ibtn hidden"></button>
  <div id="pageTitle" class="logo">iWavee</div>
  <div class="hacts">
    <button id="searchOpenBtn" class="ibtn"></button>
    <button id="profileBtn" class="ibtn"></button>
  </div>
</header>

<main>
<!-- HOME -->
<section id="view-home" class="view">
  <div id="picksRow" class="picks"></div>
  <div id="recentWrap" class="hidden sect">
    <div class="sect-h"><h3>Недавно прослушанное</h3></div>
    <div id="recentRow" class="hscroll"></div>
  </div>
  <div class="sect">
    <div class="sect-h"><h3>Популярное сейчас</h3><button class="seeall" data-go="popular">Смотреть все</button></div>
    <div id="popularList" class="tracks"></div>
  </div>
  <div class="sect">
    <div class="sect-h"><h3>Новые релизы</h3><button class="seeall" data-go="new">Смотреть все</button></div>
    <div id="newList" class="tracks"></div>
  </div>
  <div class="sect">
    <div class="sect-h"><h3>Подборки дня</h3></div>
    <div id="picksCharts" class="hscroll"></div>
  </div>
</section>

<!-- SEARCH -->
<section id="view-search" class="view">
  <div class="searchbox">
    <span class="sico"></span>
    <input id="searchInput" placeholder="Треки, артисты, альбомы..." autocomplete="off">
    <button id="searchClear" class="clr hidden">×</button>
  </div>
  <div id="historyBox" class="chips"></div>
  <div id="suggBox" class="sugg hidden"></div>
  <div id="searchResults" class="tracks"></div>
</section>

<!-- GENERIC LIST -->
<section id="view-list" class="view">
  <div class="list-h"><h3 id="listTitle"></h3><span id="listCount" class="badge"></span></div>
  <div id="listBody" class="tracks"></div>
</section>

<!-- PLAYLISTS -->
<section id="view-playlists" class="view">
  <div class="list-h"><h3>Мои плейлисты</h3><button id="plCreate" class="seeall">+ Создать</button></div>
  <div id="plBody" class="tracks"></div>
</section>

<!-- PROFILE -->
<section id="view-profile" class="view">
  <div class="pf-card">
    <div id="pfAva" class="ava">🎵</div>
    <div><div id="pfName" class="pf-name">Гость</div><div id="pfUser" class="pf-sub"></div></div>
  </div>
  <div id="pfStats" class="pf-stats"></div>
  <div class="set-card">
    <div class="set-row"><span>Качество звука</span>
      <div class="seg" id="qSeg">
        <button data-q="96kbps">96</button><button data-q="160kbps">160</button><button data-q="320kbps">320</button>
      </div>
    </div>
    <div class="set-row"><span>Кроссфейд</span>
      <div class="seg" id="cfSeg">
        <button data-cf="0">Выкл</button><button data-cf="3">3с</button><button data-cf="5">5с</button><button data-cf="8">8с</button>
      </div>
    </div>
  </div>
  <div class="set-card">
    <button id="btnClearHist" class="danger-row">🗑 Очистить историю поиска</button>
    <button id="btnClearRecent" class="danger-row">🕘 Очистить недавние</button>
    <button id="btnClearCache" class="danger-row">⚙️ Сбросить кэш приложения</button>
  </div>
  <div class="pf-sub center">iWavee Mini App · v3.0 · @iWavee_Bot</div>
</section>
</main>

<!-- MINI PLAYER -->
<div id="miniBar" class="mini hidden">
  <div id="miniProg" class="mini-prog"></div>
  <img id="miniImg" class="mini-img" src="">
  <div class="mini-info" id="miniInfo"><div id="miniTitle" class="t"></div><div id="miniArtist" class="a"></div></div>
  <button id="miniPrev" class="ibtn sm"></button>
  <button id="miniPlay" class="pbtn"></button>
  <button id="miniNext" class="ibtn sm"></button>
</div>

<!-- FULL PLAYER -->
<div id="fullOverlay" class="full hidden">
  <div class="full-h">
    <button id="fpClose" class="ibtn"></button>
    <span>СЕЙЧАС ИГРАЕТ</span>
    <button id="fpMode" class="ibtn hidden"></button>
  </div>
  <img id="fpImg" class="fp-art" src="">
  <div class="fp-info"><div id="fpTitle"></div><div id="fpArtist"></div></div>
  <div class="fp-seek">
    <span id="fpCur">0:00</span>
    <input type="range" id="fpRange" min="0" max="1000" value="0">
    <span id="fpDur">0:00</span>
  </div>
  <div class="fp-modes">
    <button id="fpShuffle" class="mbtn"></button>
    <button id="fpRepeat" class="mbtn"></button>
  </div>
  <div class="fp-ctrl">
    <button id="fpPrev" class="ibtn lg"></button>
    <button id="fpPlay" class="pbtn xl"></button>
    <button id="fpNext" class="ibtn lg"></button>
  </div>
  <div class="fp-acts">
    <button id="fpAdd" class="abtn"><span class="i"></span><span>В плейлист</span></button>
    <button id="fpRadio" class="abtn"><span class="i"></span><span>Радио</span></button>
    <button id="fpShare" class="abtn"><span class="i"></span><span>Поделиться</span></button>
    <button id="fpSend" class="abtn"><span class="i"></span><span>В бот</span></button>
  </div>
</div>

<div id="sheetWrap" class="sheet-wrap hidden"><div id="sheet" class="sheet"></div></div>
<div id="toast" class="toast"></div>

<script src="js/api.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/player.js"></script>
<script src="js/app.js"></script>
</body>
</html>
